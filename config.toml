# Đặt file này ở: <thư_mục_gốc_repo>/.streamlit/config.toml
# (cùng cấp với app.py, KHÔNG phải trong thư mục con)

[theme]
# Dark theme cho TOÀN BỘ app (nền đen, chữ sáng) - áp dụng cho mọi widget
# Streamlit gốc (sidebar, nút bấm, bảng, tabs...). Biểu đồ Plotly/Folium cần
# tự chỉnh riêng (xem ghi chú cuối file) vì chúng không dùng theme.toml.
base = "dark"
primaryColor = "#00C2A8"          # màu nhấn (nút primary, slider, progress)
backgroundColor = "#0E1117"       # nền chính - đen
secondaryBackgroundColor = "#161A23"  # nền sidebar / card / expander - đen nhạt hơn
textColor = "#FAFAFA"             # chữ - trắng sáng
font = "sans serif"

[server]
# Giảm tải cho gói miễn phí Streamlit Community Cloud (~1GB RAM, CPU giới hạn)
maxUploadSize = 50          # MB - đủ cho Excel 365 ngày x 100 điểm, tránh OOM khi upload file quá lớn
enableStaticServing = false
runOnSave = false

[runner]
# Tắt "magic" re-run không cần thiết để giảm số lần rerun toàn script (app.py
# khá dài và có nhiều spinner/tính toán nặng - mỗi rerun thừa đều tốn CPU quota).
fastReruns = true

[browser]
gatherUsageStats = false
